name: Validate content
on:
  pull_request:
    paths: ["content-gh.json", "scripts/**"]
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/validate.py content-gh.json
